name: Validate personal networking portfolio

on:
  push:
    branches:
      - main
      - 'portfolio/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate synthetic inventory
        run: python scripts/validate_inventory.py
      - name: Validate bilingual docs and links
        run: python scripts/validate_docs.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
