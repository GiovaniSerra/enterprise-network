name: Validate portfolio inventory

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate sample site inventory
        run: python scripts/validate_inventory.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
