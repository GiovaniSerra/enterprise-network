! EXAMPLE ONLY - NOT EXECUTED OR VERIFIED ON A NETWORK DEVICE.
! Cisco IOS-style reference. Verify interface names and switch capabilities.
! Do not copy to a production device.
!
hostname SW-ACCESS-GOLD
!
vlan 5
 name NATIVE_UNUSED
vlan 100
 name MANAGEMENT
vlan 110
 name USERS_WIRED
vlan 130
 name GUEST_WIFI
!
interface Ethernet0/0
 description TRUNK_TO_SW-CORE-GOLD
 switchport mode trunk
 switchport trunk native vlan 5
 switchport trunk allowed vlan 5,100,110,130
 no shutdown
!
interface Ethernet0/1
 description PC-USER-01
 switchport mode access
 switchport access vlan 110
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface Ethernet0/2
 description PC-USER-02
 switchport mode access
 switchport access vlan 110
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface Ethernet0/3
 description PC-GUEST-01
 switchport mode access
 switchport access vlan 130
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
! No management SVI in M1. Secure access is a separate phase.
