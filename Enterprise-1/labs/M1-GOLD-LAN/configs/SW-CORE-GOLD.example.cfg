! EXAMPLE ONLY - NOT EXECUTED OR VERIFIED ON A NETWORK DEVICE.
! Cisco IOS-style L3 switch reference; actual feature support may differ.
! ACL is stateless, protects only guest-originated traffic entering VLAN130 SVI.
! Do not copy to a production device.
!
hostname SW-CORE-GOLD
ip routing
!
vlan 5
 name NATIVE_UNUSED
vlan 100
 name MANAGEMENT
vlan 110
 name USERS_WIRED
vlan 130
 name GUEST_WIFI
!
interface Ethernet0/0
 description TRUNK_TO_SW-ACCESS-GOLD
 switchport mode trunk
 switchport trunk native vlan 5
 switchport trunk allowed vlan 5,100,110,130
 no shutdown
!
interface Vlan110
 description USERS_GATEWAY
 ip address 10.10.10.1 255.255.255.0
 no shutdown
!
interface Vlan130
 description GUEST_GATEWAY
 ip address 10.10.30.1 255.255.255.0
 ip access-group GUEST-IN in
 no shutdown
!
ip access-list extended GUEST-IN
 remark DEMO ONLY: Guest may ping its own gateway for M1 diagnostics
 permit icmp 10.10.30.0 0.0.0.255 host 10.10.30.1 echo
 remark Deny Guest toward RFC1918 private destinations
 deny ip 10.10.30.0 0.0.0.255 10.0.0.0 0.255.255.255 log
 deny ip 10.10.30.0 0.0.0.255 172.16.0.0 0.15.255.255 log
 deny ip 10.10.30.0 0.0.0.255 192.168.0.0 0.0.255.255 log
 remark Permit other destinations, but NO upstream route/NAT exists in M1
 permit ip 10.10.30.0 0.0.0.255 any
!
! VLAN100 intentionally has no SVI/management access in phase M1.
